name: Detect changes
description: Reports whether the change touches anything outside the docs and
  the ignore files.

# The caller must check out with fetch-depth 0, since this diffs against the
# base commit.
outputs:
  code:
    description: true when a file outside the docs and the ignore files changed
    value: ${{ steps.filter.outputs.code }}

runs:
  using: composite
  steps:
    - name: Look for changes outside the docs and the ignore files
      id: filter
      shell: bash
      run: |
        set -euo pipefail
        base="${{ github.event.pull_request.base.sha }}"
        if [ -z "$base" ]; then
          base="${{ github.event.before }}"
        fi
        # An unknown base means the diff cannot be trusted, so run everything.
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "base unknown, treating this as a source change"
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(git diff --name-only "$base" HEAD)
        if [ -z "$files" ]; then
          echo "no files in the diff, treating this as a source change"
          echo "code=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "$files"
        # Everything absent from this list reaches the binary or the suites.
        # .github/ and scripts/ are left out on purpose: a workflow or a
        # release script is not a document.
        #
        # The three ignore files are here because no build step or suite reads
        # them: .gitignore and .ignore steer Git and ripgrep, and
        # .git-blame-ignore-revs steers git blame. .clang-format and
        # .clang-format-ignore are not, since `make check-format` reads both.
        #
        # NOTE: no grep -q here. It exits on the first match, and the SIGPIPE
        # that gives printf would fail the pipeline under pipefail and read as
        # a docs-only change.
        skip='(^|/)[^/]+\.md$|^docs/|^LICENSE$'
        skip="$skip"'|^\.gitignore$|^\.ignore$|^\.git-blame-ignore-revs$'
        outside=$(printf '%s\n' "$files" |
          grep -vE "$skip" || true)
        if [ -n "$outside" ]; then
          echo "outside the docs and the ignore files:"
          echo "$outside"
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "docs and ignore files only"
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi
