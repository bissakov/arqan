name: Release build

# The tag workflow runs scripts/release-linux.sh too late: by then the change
# that broke the Debian 11, EL9 or musl build, or the packages, is merged. This
# runs the same script on every change, so the change that breaks it fails.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A required check that never reports blocks the pull request forever, so
  # this job always runs and the expensive one skips instead. GitHub reports a
  # job skipped by `if:` as a success, which satisfies the required check.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Detect changes outside the docs
        id: detect
        uses: ./.github/actions/detect-changes

  packages:
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-24.04
    steps:
      - name: Check change detection
        if: needs.changes.result != 'success' || needs.changes.outputs.code != 'true'
        run: |
          echo "change detection failed" >&2
          exit 1
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Build, test and install the release packages
        run: scripts/release-linux.sh
        env:
          # The same reason as in test.yml: three jobs per core on the four
          # shared cores starve the suite into false failures.
          ARQAN_TEST_JOBS: 4
