name: Package repositories

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage the signing key
        env:
          SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEY" ]] || {
            echo 'set the REPO_SIGNING_KEY secret to an armored private key' >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing-key.asc"
      - name: Build the repositories
        env:
          GH_TOKEN: ${{ github.token }}
          ARQAN_REPO_SLUG: ${{ github.repository }}
          ARQAN_REPO_URL: ${{ steps.pages.outputs.base_url }}
          ARQAN_REPO_SIGNING_KEY: ${{ runner.temp }}/signing-key.asc
        run: scripts/publish-repos.sh
      - name: Discard the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.asc"
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
