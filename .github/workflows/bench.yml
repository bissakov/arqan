name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A required check that never reports blocks the pull request forever, so
  # this job always runs and the expensive one skips instead. GitHub reports a
  # job skipped by `if:` as a success, which satisfies the required check.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Detect changes outside the docs
        id: detect
        uses: ./.github/actions/detect-changes

  guard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # This job builds two whole trees, the reference and this change, so it
      # pays the build twice. ccache is content-addressed and returns
      # byte-identical objects, so the binaries measured here are the ones
      # that would have been built without it.
      CC: ccache cc
    steps:
      - name: Check out source and history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libcurl4-openssl-dev ccache
      # Restored after the checkout, so the cached objects are newer than the
      # sources and make does not rebuild what ccache would have served. The
      # reference commit is usually the previous run's head, so its tree is
      # served from cache rather than compiled again.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-bench-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-bench-${{ runner.os }}-
      - name: Size the compiler cache
        run: ccache -M 500M -z
      - name: Resolve the reference commit
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse "HEAD^")
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # CPU is read from the child's schedstat, so a noisy neighbour costs wall
      # time and not the verdict. The tolerance still allows for a shared vCPU.
      - name: Measure the reference and this change
        env:
          TOLERANCE: '1.5'
        run: scripts/bench-guard.sh ${{ steps.ref.outputs.sha }}
      - name: Report the compiler cache
        if: always()
        run: ccache -s
      - name: Retain both reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bench-${{ github.run_id }}
          path: |
            bench-base.json
            bench-head.json
          if-no-files-found: warn
