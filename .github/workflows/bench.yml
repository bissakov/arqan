name: Benchmarks

# Pull requests only, as in test.yml. Drift measures main against the newest
# release every week.
on:
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A required check that never reports blocks the pull request forever, so
  # this job always runs and the expensive one skips instead. GitHub reports a
  # job skipped by `if:` as a success, which satisfies the required check.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Detect changes outside the docs
        id: detect
        uses: ./.github/actions/detect-changes

  measure:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # This job builds two whole trees, the reference and this change, so it
      # pays the build twice. ccache is content-addressed and returns
      # byte-identical objects, so the binaries measured here are the ones
      # that would have been built without it.
      CC: ccache cc
      BENCH_SHARD: ${{ matrix.shard }}/3
    steps:
      - name: Check out source and history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libcurl4-openssl-dev ccache
      - name: Restore the compiler cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-bench-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-bench-${{ runner.os }}-
      - name: Size the compiler cache
        run: ccache -M 500M -z
      - name: Resolve the reference commit
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse "HEAD^")
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # CPU is read from the child's schedstat, so a noisy neighbour costs wall
      # time and not the verdict. The tolerance still allows for a shared vCPU.
      - name: Measure the reference and this change
        env:
          TOLERANCE: '1.5'
        run: scripts/bench-guard.sh ${{ steps.ref.outputs.sha }}
      - name: Report the compiler cache
        if: always()
        run: ccache -s
      - name: Save the compiler cache
        if: matrix.shard == 1 && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Retain both reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bench-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            bench-base.json
            bench-head.json
          if-no-files-found: warn

  guard:
    needs: [changes, measure]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-24.04
    steps:
      - name: Check benchmark results
        env:
          PASSED: ${{ needs.changes.result == 'success' && needs.measure.result == 'success' }}
        run: |
          if [ "$PASSED" != true ]; then
            echo "a benchmark shard or change detection failed" >&2
            exit 1
          fi
