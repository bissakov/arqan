name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A required check that never reports blocks the pull request forever, so
  # this job always runs and the expensive one skips instead. GitHub reports a
  # job skipped by `if:` as a success, which satisfies the required check.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Detect changes outside the docs
        id: detect
        uses: ./.github/actions/detect-changes

  run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # ccache returns byte-identical objects, so this buys build time and
      # changes nothing that is tested. The unity translation unit misses
      # whenever src/ changes, which is the point; the two dozen tree-sitter
      # objects under build/highlight are a constant and always hit.
      CC: ccache cc
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Check CI sharding
        run: python3 -m unittest tests.test_ci
      # Static, needs no toolchain, so it fails fast and before the build.
      - name: Check for loose globals
        run: make check-globals
      - name: Install clang-format
        run: pipx install clang-format==22.1.8
      - name: Check formatting
        run: make check-format
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libcurl4-openssl-dev ccache
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-test-${{ runner.os }}-
      - name: Build
        run: |
          ccache -M 500M -z
          make -j"$(nproc)" all bin/arqan-test EXTRA_CFLAGS=-Werror
          ccache -s
      # Arena and JSON invariants, compiled standalone rather than through the
      # unity build. Seconds, and it fails before the pty suite gets a turn.
      - name: Run the unit suite
        run: make test-unit EXTRA_CFLAGS=-Werror
      # The suite drives a pty against a mock provider on loopback and needs
      # no network. A warning is a failure here, as it is in the guidelines.
      - name: Run the end-to-end suite
        run: python3 scripts/ci_run.py test ${{ matrix.shard }}/2
        env:
          ARQAN_TEST_BIN: bin/arqan-test
          # The runner has four shared cores and the suite's waits are quiet
          # windows, so the usual three-per-core oversubscription starves
          # children long enough for a stall to read as a settled screen.
          ARQAN_TEST_JOBS: 4

  suite:
    needs: [changes, run]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false')
    runs-on: ubuntu-24.04
    steps:
      - name: Check test results
        env:
          PASSED: ${{ needs.changes.result == 'success' && needs.run.result == 'success' }}
        run: |
          if [ "$PASSED" != true ]; then
            echo "a test shard or change detection failed" >&2
            exit 1
          fi
