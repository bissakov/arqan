name: Linux release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-linux-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate tag against source version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^[[:space:]]*#[[:space:]]*define[[:space:]]+AGENT_VERSION[[:space:]]+"/ {
            value=$0; sub(/^[^"]*"/, "", value); sub(/".*$/, "", value); print value; count++
          } END { if (count != 1) exit 1 }' src/agent.h)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test compatibility release
        run: scripts/release-linux.sh
      - name: Retain release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arqan-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arqan-${{ github.ref_name }}-linux-x86_64
          path: dist
      - name: Create or update draft release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          fail_on_unmatched_files: true
